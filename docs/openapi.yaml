openapi: 3.0.3
info:
  title: ArcadeMatrix Local API
  description: API for controlling and configuring the ArcadeMatrix ESP32 firmware locally over Wi-Fi.
  version: 3.0.1
servers:
  - url: http://ArcadeMatrix.local
    description: Default local mDNS address (or use the device's assigned IP)
tags:
  - name: System
    description: System status and power controls
  - name: Configuration
    description: Global settings and themes
  - name: Media
    description: Fonts, GIFs, and Playlists
  - name: Engines
    description: Direct control of specific display engines

paths:
  /api/status:
    get:
      tags:
        - System
      summary: Get system status
      description: Returns memory usage, uptime, and system health.
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "online"
                  uptime:
                    type: integer
                    description: Uptime in milliseconds
                  free_heap:
                    type: integer
                  min_free_heap:
                    type: integer
                  max_alloc_heap:
                    type: integer
                  psram_found:
                    type: boolean
                  render:
                    type: object
                    description: >-
                      Render-loop rates over the window since the previous /api/status call
                      (absent on the first call and for windows under 500 ms). Poll twice, a few
                      seconds apart, to read them.
                    properties:
                      window_ms:
                        type: integer
                      loop_fps:
                        type: number
                        description: Main render-loop iterations per second
                      present_fps:
                        type: number
                        description: Framebuffer flips per second
                      gif_fps:
                        type: number
                        description: GIF/PNG frames pushed to the panel per second
                      gif_blit_ms:
                        type: number
                        description: Average time per GIF frame spent writing pixels to the panel
                      gif_decode_ms:
                        type: number
                        description: Average time per GIF frame spent decoding
                      gif_pixels_written_pct:
                        type: number
                        description: Share of panel pixels actually written per GIF frame (dirty-pixel blit)

  /api/fighter/status:
    get:
      tags:
        - System
      summary: Fighter overlay diagnostics
      description: >-
        State of the fighter overlay for troubleshooting: whether it has been instantiated (it is only
        created when the global fighter switch is on and a rotation slot asks for it), the sprite
        folder and roster size, loader/preload state, current and next players, memory floors and the
        last warning it logged.
      responses:
        '200':
          description: Fighter state
          content:
            application/json:
              schema:
                type: object
                properties:
                  instantiated:
                    type: boolean
                  dir:
                    type: string
                    example: "/fighters_32"
                  roster_count:
                    type: integer
                  has_roster:
                    type: boolean
                  has_psram:
                    type: boolean
                  active:
                    type: boolean
                    description: A fight is being drawn right now
                  loader_task:
                    type: boolean
                  preloading:
                    type: boolean
                  next_ready:
                    type: boolean
                  retry_in_ms:
                    type: integer
                    description: Milliseconds until the next fight or preload attempt
                  p1:
                    type: string
                  p2:
                    type: string
                  next_p1:
                    type: string
                  next_p2:
                    type: string
                  free_heap:
                    type: integer
                  free_dma:
                    type: integer
                  free_psram:
                    type: integer
                  last_note:
                    type: string
                    description: Last warning or error the engine logged

  /api/settings:
    get:
      tags:
        - Configuration
      summary: Get all settings
      description: Returns the entire device configuration (Matrix, Clock, Weather, WiFi, MQTT, Standby, etc).
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
        - Configuration
      summary: Update settings
      description: Partially update settings. Any omitted keys will remain unchanged. Will automatically save to SD card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matrix_rows:
                  type: integer
                  description: "Matrix height in pixels (16, 32, 64)"
                  example: 32
                matrix_cols:
                  type: integer
                  description: "Matrix width in pixels (32, 64, 128)"
                  example: 64
                matrix_chain:
                  type: integer
                  description: "Number of chained panels"
                  example: 2
                brightness_limit:
                  type: integer
                  description: "Global brightness power limit percent (10-100)"
                  example: 50
                color_depth:
                  type: integer
                  description: "Color depth per channel (3-8 bits, default 8)"
                  example: 8
                matrix_rgb_sequence:
                  type: string
                  enum: [RGB, RBG, GRB, GBR, BRG, BGR]
                  description: "RGB color sequence order"
                  example: "RGB"
                matrix_driver_chip:
                  type: string
                  enum: [SHIFTREG, FM6124, FM6126A, ICN2038S, MBI5124, SM16208]
                  description: "LED Panel Hardware Driver Chip"
                  example: "SHIFTREG"
                matrix_clk_phase:
                  type: boolean
                  description: "Clock Phase toggle for pixel alignment"
                  example: false
                matrix_latch_blanking:
                  type: integer
                  description: "Latch blanking timing (0-4 cycles)"
                  example: 0
                matrix_row_address_mode:
                  type: integer
                  description: "Row addressing mode (0=Default/Direct, 1=ShiftRegister, 2=Direct 16 lines)"
                  example: 0
                matrix_force_single_buffer:
                  type: boolean
                  description: "Forces single DMA buffer to reduce RAM usage"
                  example: false
                matrix_limit_refresh_rate_hz:
                  type: integer
                  description: "Refresh rate cap in Hz (default 90)"
                  example: 90
                crypto_symbols:
                  type: string
                  description: "Comma-separated crypto token symbols (e.g. BTC,ETH,SOL,DOGE)"
                crypto_cache_ttl_min:
                  type: integer
                  description: "Crypto quote cache TTL in minutes (refresh rate, default 1)"
                stock_symbols:
                  type: string
                  description: "Comma-separated stock ticker symbols (e.g. AAPL,NVDA,TSLA,MSFT)"
                stock_cache_ttl_min:
                  type: integer
                  description: "Stock quote cache TTL in minutes (refresh rate, default 1)"
                sprite_count:
                  type: integer
                  description: "Sprite/Fighter overlay toggle (0 = disabled/OFF, 2 = enabled/ON)"
                fighter_interval_sec:
                  type: integer
                  description: "Interval in seconds between MUGEN fights"
      responses:
        '200':
          description: Settings successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sd_saved:
                    type: boolean
                  warning:
                    type: string
        '503':
          description: >-
            The change was applied in memory but could not be written to the SD card (card busy with a
            rescan or upload, or the write failed); it will be lost at reboot. Retry in a moment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  sd_saved:
                    type: boolean
                    example: false
                  error:
                    type: string

  /api/system:
    get:
      tags:
        - Configuration
      summary: Get system, matrix, mqtt, and wifi configuration
      description: Returns the unified system configuration object with complete nested blocks.
      responses:
        '200':
          description: Grouped configuration blocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  system:
                    type: object
                    properties:
                      lang: { type: string, example: "fr" }
                      timezone: { type: string, example: "Europe/Paris" }
                      format_24h: { type: boolean, example: true }
                      night_mode_enabled: { type: boolean, example: false }
                      turn_off_at: { type: string, example: "23:00" }
                      wake_up_at: { type: string, example: "07:00" }
                      night_brightness: { type: integer, example: 10 }
                      day_brightness: { type: integer, example: 50 }
                      brightness_limit: { type: integer, example: 50 }
                      idle_fighter_enabled: { type: boolean, example: false }
                      idle_fighter_interval: { type: integer, example: 30 }
                      idle_fighter_speed: { type: integer, example: 100, minimum: 25, maximum: 200 }
                  matrix:
                    type: object
                    properties:
                      height: { type: integer, example: 32 }
                      width: { type: integer, example: 64 }
                      chain_length: { type: integer, example: 1 }
                      driver_chip: { type: string, example: "SHIFTREG" }
                      row_address_mode: { type: integer, example: 0 }
                      rgb_sequence: { type: string, example: "RGB" }
                      pwm_bits: { type: integer, example: 8 }
                      limit_refresh_rate_hz: { type: integer, example: 90 }
                  mqtt:
                    type: object
                    properties:
                      enabled: { type: boolean, example: false }
                      broker: { type: string, example: "127.0.0.1" }
                      port: { type: integer, example: 1883 }
                      user: { type: string, example: "" }
                      pass: { type: string, example: "" }
                      device_name: { type: string, example: "ArcadeMatrix" }
                      allow_overlay: { type: boolean, example: false }
                  wifi:
                    type: object
                    properties:
                      ssid: { type: string, example: "HomeWiFi" }
                      hostname: { type: string, example: "ArcadeMatrix" }
    post:
      tags:
        - Configuration
      summary: Update system, matrix, or mqtt settings
      description: Partial update. Saves to SD card. Triggers automatic reboot if matrix or MQTT state changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result with status (success or rebooting)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  lang: { type: string, example: "fr" }

  /api/stats:
    get:
      tags:
        - System
      summary: Live hardware and system statistics
      description: Returns CPU load, free memory, temperature, and uptime for dashboard gauges and SysInfo engine.
      responses:
        '200':
          description: Live statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "3.0.0" }
                  arch: { type: string, example: "esp32s3" }
                  uptime: { type: integer, description: "Uptime in seconds", example: 3600 }
                  cpu_load: { type: number, example: 15.2 }
                  ram_used_mb: { type: integer, example: 55 }
                  ram_total_mb: { type: integer, example: 320 }
                  temperature_c: { type: number, example: 42.5 }
                  temperature_f: { type: number, example: 108.5 }

  /api/system/power:
    post:
      tags:
        - System
      summary: Toggle LED Matrix Power
      description: Turn the display on or off without rebooting the ESP32.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: boolean
                  description: True to turn on the LEDs, False to turn off.
      responses:
        '200':
          description: Success

  /api/system/reboot:
    post:
      tags:
        - System
      summary: Reboot the ESP32
      responses:
        '200':
          description: Device will reboot in 500ms

  /api/system/restart:
    post:
      tags:
        - System
      summary: Restart the ESP32
      responses:
        '200':
          description: Device will reboot in 500ms

  /api/system/restart_app:
    post:
      tags:
        - System
      summary: Restart application
      responses:
        '200':
          description: Device will reboot in 500ms

  /api/system/shutdown:
    post:
      tags:
        - System
      summary: Reboot the ESP32 (Alias)
      description: Since ESP32 cannot fully power down via software, this acts as a reboot.
      responses:
        '200':
          description: Device will reboot in 500ms

  /api/mqtt/install:
    post:
      tags:
        - Integrations
      summary: Install MQTT sync script via SSH (Parity stub on ESP32)
      responses:
        '200':
          description: Information message

  /api/mqtt/logs:
    post:
      tags:
        - Integrations
      summary: Fetch MQTT sync logs via SSH (Parity stub on ESP32)
      responses:
        '200':
          description: Log output or information message

  /api/wifi:
    post:
      tags:
        - System
      summary: Reconfigure Wi-Fi
      description: Updates the Wi-Fi credentials and attempts to connect immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successfully connected to new network
        '500':
          description: Failed to connect

  /api/fonts:
    get:
      tags:
        - Media
      summary: List available custom fonts
      description: Returns a list of .amf font files found in the /fonts directory on the SD card.
      responses:
        '200':
          description: Array of font paths
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "/fonts/6x9.amf"

  /api/playlists:
    get:
      tags:
        - Media
      summary: Get indexed GIF playlists (Horizontal YOKO and Vertical TATE)
      description: 'Returns indexed GIF playlists from SD card storage (/gifs and /gifs_tate). Returns grouped { yoko: {...}, tate: {...} } or orientation-specific playlists when filtered with query parameter.'
      parameters:
        - name: type
          in: query
          description: Optional filter for orientation (all, yoko, tate)
          required: false
          schema:
            type: string
            enum: [all, yoko, tate]
        - name: folder
          in: query
          description: Optional playlist folder path filter
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Grouped or specific GIF playlists dictionary with path and animation counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  yoko:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "/gifs/arcade"
                        count:
                          type: integer
                          example: 25
                  tate:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "/gifs_tate/shmup"
                        count:
                          type: integer
                          example: 10
        '404':
          description: Index not generated yet.

  /api/playlists/selected:
    get:
      tags:
        - Media
      summary: Get active GIF playlists
      description: Returns the user's currently selected playlists.
      responses:
        '200':
          description: Selected playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlists:
                    type: array
                    items:
                      type: string

  /api/playlists/save:
    post:
      tags:
        - Media
      summary: Save active GIF playlists
      description: Updates the default selected playlists and saves them to SD card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playlists:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Success

  /api/playlists/play:
    post:
      tags:
        - Media
      summary: Play specific GIF playlists immediately
      description: Temporarily override the current rotation and start playing the provided playlists immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playlists:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Success

  /api/clock:
    post:
      tags:
        - Engines
      summary: Change Clock Theme
      description: Dynamically change the current clock theme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clock_theme:
                  type: integer
                  description: The PublisherTheme Enum ID (0=NINTENDO, 1=CAPCOM, etc).
      responses:
        '200':
          description: Success

  /api/message:
    post:
      tags:
        - Engines
      summary: Display a Marquee Text Message
      description: Interrupts the current engine and scrolls a custom text message across the screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  example: "Hello World!"
                color:
                  type: integer
                  description: Text color as RGB565 integer (default 63488 / RED).
                size:
                  type: integer
                  description: Text scale multiplier (default 2).
                direction:
                  type: string
                  enum: [rtl, ltr]
                  description: Scroll direction (default rtl).
                speed:
                  type: integer
                  description: Scroll delay in milliseconds (default 30).
                timeoutSeconds:
                  type: integer
                  description: Maximum time to show the message before returning to normal rotation (default 30).
      responses:
        '200':
          description: Success

  /api/upload:
    post:
      tags:
        - System
      summary: Upload Asset File (GIF, PNG, JPG)
      description: Upload an asset file to storage with single-file overwrite. Returns JSON with the resolved storage path.
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: Upload destination target category (e.g. marquee)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Asset uploaded successfully.
        '400':
          description: No file received or upload error.

  /api/gifs/library:
    get:
      tags:
        - GIF Library
      summary: List playlist folders
      description: Playlist folders of one library with their media file counts. `orientation` selects the horizontal (`/gifs`) or vertical (`/gifs_tate`) root, matching the split GifEngine makes between the two.
      parameters:
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: '`{"root":"/gifs_tate","orientation":"tate","folders":{"Arcade":{"path":"/gifs_tate/Arcade","count":120}}}`'
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly

  /api/gifs/files:
    get:
      tags:
        - GIF Library
      summary: List files of one playlist folder
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
          description: Plain playlist folder name (no path separators)
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: '`{"folder":"Arcade","orientation":"yoko","path":"/gifs/Arcade","files":[{"name":"a.gif","bytes":1234}]}`'
        '400':
          description: Missing or invalid folder name.
        '404':
          description: Folder not found.
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly

  /api/gifs/file:
    get:
      tags:
        - GIF Library
      summary: Serve one media file (preview or download)
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: File name (.gif, .png or .raw)
        - name: download
          in: query
          required: false
          schema:
            type: string
          description: 'Set to `1` to receive a `Content-Disposition: attachment` header.'
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: The file bytes with an image content type.
        '404':
          description: File not found.
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly
    delete:
      tags:
        - GIF Library
      summary: Delete one media file
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: '`{"status":"ok","orientation":"yoko","deleted":"/gifs/Arcade/a.gif"}`'
        '404':
          description: File not found.
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly

  /api/gifs/upload:
    post:
      tags:
        - GIF Library
      summary: Upload one or many media files into a playlist folder
      description: Multipart upload; every `file` part is written to `<root>/<folder>/<basename>`, where `<root>` is the library chosen by `orientation`. The folder is created when missing. While the upload runs the screen rotation is suspended and the panel shows an upload notice; both are restored when the request completes or the client disconnects. Unsupported types are reported in `skipped`. Names are sanitized to plain file names.
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
          description: Target playlist folder (plain name, no path separators)
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: '`{"status":"ok","folder":"Arcade","count":2,"saved":[{"name":"a.gif","bytes":1234}],"skipped":[{"name":"notes.txt","reason":"unsupported type"}]}`'
        '400':
          description: Invalid folder name, or no file could be saved.

  /api/gifs/mkdir:
    post:
      tags:
        - GIF Library
      summary: Create a playlist folder
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: Folder created.
        '409':
          description: Folder already exists.
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly

  /api/gifs/rename:
    post:
      tags:
        - GIF Library
      summary: Rename a playlist folder or one of its files
      description: Without `name` the folder itself is renamed to `to`; with `name` that file is renamed (a bare `to` keeps the original extension). Index files are refreshed.
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: '`{"status":"ok","orientation":"yoko","renamed_to":"/gifs/NewName"}`'
        '404':
          description: Source not found.
        '409':
          description: Target already exists.
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly

  /api/gifs/reindex:
    post:
      tags:
        - GIF Library
      summary: Rebuild every folder's index.txt and playlists.json from the card (background)
      description: Rebuilds **both** libraries (`/gifs` and `/gifs_tate`), so vertical display playlists are rebuilt too; the `orientation` parameter does not apply here. The walk over the whole library is too slow to run inside a request on the ESP32, so it is started as a background task while the screen rotation is suspended and the panel shows a notice. Poll `/api/gifs/reindex/status`. The rescan slot is claimed atomically, so a second request while one is running answers `409`. Uploads, deletes and renames keep `index.txt` / `playlists.json` current on their own, so a rescan is only needed after the card was edited offline.
      responses:
        '202':
          description: Rescan started
        '409':
          description: A rescan is already running
        '500':
          description: The background task could not be started
    delete:
      tags:
        - GIF Library
      summary: Cancel a running rescan
      description: Sets the cancel flag; it is honoured between folders, so the folder being indexed finishes first.
      responses:
        '202':
          description: '`{"status":"cancelling"}`'
        '409':
          description: '`{"status":"idle"}` - no rescan is running'
  /api/gifs/reindex/status:
    get:
      tags:
        - GIF Library
      summary: Progress of the background rescan
      responses:
        '200':
          description: '`{ running, total, done, files, expected, eta, cancelling, current, last_result, elapsed_ms }` - totals cover both libraries'
  /api/gifs/folder:
    delete:
      tags:
        - GIF Library
      summary: Delete a playlist folder recursively
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [yoko, tate]
            default: yoko
          description: Which library to act on - `yoko` is the horizontal root (`/gifs`), `tate` the vertical one (`/gifs_tate`). Unrecognised values fall back to `yoko`.
      responses:
        '200':
          description: '`{"status":"ok","orientation":"yoko","deleted":"/gifs/Arcade","files":120}`'
        '503':
          description: SD card busy (a rescan holds the card) - retry shortly
        '404':
          description: Folder not found.

  /api/marquee:
    post:
      tags:
        - Engines
      summary: Stream Raw RGB565 Image Data
      description: Push raw, uncompressed RGB565 image data directly to the matrix frame buffer. Payload size must exactly match the screen resolution (width * height * 2 bytes).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Image received and displayed.
        '400':
          description: Invalid payload size.

  /api/sensor:
    get:
      tags:
        - Engines
      summary: Get Indoor Temperature & Humidity Sensor Data
      description: Returns real-time ambient temperature (°C and °F), humidity (%), unit preference, and sensor connection status. Suitable for Home Assistant REST sensor integration.
      responses:
        '200':
          description: Sensor environment data
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  temperature_c:
                    type: number
                  temperature_f:
                    type: number
                  humidity:
                    type: number
                  unit:
                    type: string
                  status:
                    type: string

  /api/visualizer:
    post:
      tags:
        - Engines
      summary: Control Priority Rhythmic Music Visualizer
      description: Toggle the audio-reactive visualizer display override and select active visualizer mode or mic gain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                gain:
                  type: number
      responses:
        '200':
          description: Success

  /api/hardware:
    get:
      tags:
        - System
      summary: Get hardware profile and runtime capabilities
      description: Returns the detected board profile (ESP32_STD vs WAVESHARE_S3) and dynamic peripheral presence (PSRAM, microphone, temperature sensor, gyroscope).
      responses:
        '200':
          description: Hardware capabilities snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: string
                    example: "WAVESHARE_S3"
                  psram:
                    type: object
                    properties:
                      available:
                        type: boolean
                      bytes:
                        type: integer
                  microphone:
                    type: boolean
                  temperature_sensor:
                    type: boolean
                  gyroscope:
                    type: boolean

  /api/themes:
    get:
      tags:
        - Configuration
      summary: List available clock and date themes
      description: Dynamic options endpoint returning all 30 built-in publisher pixel-art and animated themes.
      responses:
        '200':
          description: List of themes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string

  /api/instances:
    get:
      tags:
        - Configuration
      summary: List all configured engine instances
      description: Returns instances currently loaded in config.json.
      responses:
        '200':
          description: List of instances
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    instance_id:
                      type: string
                    engine_id:
                      type: string
                    config:
                      type: object
    post:
      tags:
        - Configuration
      summary: Create or update an engine instance
      description: Validates against descriptor schema, sanitizes, persists to SD, and dispatches onConfigChanged() hot reload without reboot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instance_id
                - engine_id
              properties:
                instance_id:
                  type: string
                engine_id:
                  type: string
                config:
                  type: object
      responses:
        '200':
          description: Configuration updated and hot reloaded.
        '503':
          description: >-
            The change was applied in memory but could not be written to the SD card (card busy with a
            rescan or upload, or the write failed); it will be lost at reboot. Retry in a moment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  sd_saved:
                    type: boolean
                    example: false
                  error:
                    type: string

  /api/rotation:
    get:
      tags:
        - Engines
      summary: List configured display rotation entries
      description: Returns the active sequence of display rotation instances with durations and overlay settings.
      responses:
        '200':
          description: List of rotation slots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    instance_id:
                      type: string
                    duration_sec:
                      type: integer
                    overlays:
                      type: object
                      properties:
                        fighter:
                          type: boolean
    post:
      tags:
        - Engines
      summary: Replace display rotation sequence
      description: Sets the complete rotation sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - instance_id
                properties:
                  instance_id:
                    type: string
                  duration_sec:
                    type: integer
                  overlays:
                    type: object
                    properties:
                      fighter:
                        type: boolean
      responses:
        '200':
          description: Rotation updated
        '503':
          description: >-
            The change was applied in memory but could not be written to the SD card (card busy with a
            rescan or upload, or the write failed); it will be lost at reboot. Retry in a moment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  sd_saved:
                    type: boolean
                    example: false
                  error:
                    type: string

  /api/engines:
    get:
      tags:
        - Engines
      summary: List registered engines with schema, capabilities, and availability
      description: Schema-driven engine discovery endpoint. UI consumes this to render configuration forms, dynamic options dropdowns, and hardware availability banners.
      responses:
        '200':
          description: List of engine descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        category:
                          type: string
                        version:
                          type: string
                    capabilities:
                      type: object
                      properties:
                        supports_128x32:
                          type: boolean
                        supports_256x64:
                          type: boolean
                        realtime:
                          type: boolean
                        interruptible:
                          type: boolean
                        selfPaced:
                          type: boolean
                        allowsOverlay:
                          type: boolean
                          description: Whether this engine authorizes transverse overlays (like Fighter).
                        allowRotation:
                          type: boolean
                          description: Whether this engine can be selected by users in the rotation loop.
                    requirements:
                      type: object
                      properties:
                        needs_psram:
                          type: boolean
                        needs_audio:
                          type: boolean
                        needs_temp_sensor:
                          type: boolean
                        needs_gyroscope:
                          type: boolean
                        needs_network:
                          type: boolean
                        needs_sd:
                          type: boolean
                    available:
                      type: boolean
                    reason:
                      type: string
                    schema:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          field_type:
                            type: integer
                          label:
                            type: string
                          description:
                            type: string
                          default_value:
                            type: string
                          options:
                            type: string
                          options_endpoint:
                            type: string
                          multiple:
                            type: boolean
                          visible_when:
                            type: string

  /api/version:
    get:
      tags:
        - System
      summary: Get firmware version and build information
      description: Returns firmware semantic version, git commit hash, and build timestamp.
      responses:
        '200':
          description: Build version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "3.0.0"
                  git_commit:
                    type: string
                    example: "a63490c"
                  build_timestamp:
                    type: string
                    example: "2026-08-22 12:00:00 UTC"
                  arch:
                    type: string
                    example: "esp32s3"
                  running_partition:
                    type: string
                    example: "app0"

  /api/hardware:
    get:
      tags:
        - System
      summary: Hardware detection and capabilities
      description: Returns detected hardware peripherals (sensors, audio codecs, gyroscope, SD card, PSRAM).
      responses:
        '200':
          description: Hardware profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_temp_sensor: { type: boolean, example: true }
                  has_audio_input: { type: boolean, example: true }
                  has_audio_output: { type: boolean, example: true }
                  has_gyroscope: { type: boolean, example: true }
                  has_psram: { type: boolean, example: true }
                  has_sd: { type: boolean, example: true }

  /api/sensor:
    get:
      tags:
        - System
      summary: Get live environmental sensor readings (SHTC3)
      description: Returns temperature (°C and °F) and relative humidity (%) from onboard SHTC3 sensor.
      responses:
        '200':
          description: Sensor data
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean, example: true }
                  temperature_c: { type: number, example: 22.4 }
                  temperature_f: { type: number, example: 72.3 }
                  humidity: { type: number, example: 48.6 }

  /api/audio/status:
    get:
      tags:
        - Audio
      summary: Get audio subsystem and playback status
      description: Returns current audio playback snapshot (source, title, artist, volume, status).
      responses:
        '200':
          description: Audio status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, example: "WebRadio" }
                  status: { type: integer, description: "0=STOPPED, 1=PLAYING, 2=PAUSED, 3=BUFFERING, 4=ERROR", example: 1 }
                  title: { type: string, example: "SomaFM Vaporwaves" }
                  artist: { type: string, example: "Synthwave Artist" }
                  album: { type: string, example: "" }
                  duration_ms: { type: integer, example: 0 }
                  position_ms: { type: integer, example: 12400 }
                  volume: { type: integer, minimum: 0, maximum: 100, example: 80 }
                  artwork_id: { type: string, example: "" }
                  generation: { type: integer, example: 3 }

  /api/audio/radio:
    post:
      tags:
        - Audio
      summary: Control WebRadio playback
      description: Starts streaming a WebRadio station from an HTTP/HTTPS stream URL, or stops it if url is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, example: "http://ice1.somafm.com/vaporwaves-128-mp3" }
                name: { type: string, example: "SomaFM Vaporwaves" }
      responses:
        '200':
          description: WebRadio stream started or stopped
        '400':
          description: Invalid request payload
        '500':
          description: Failed to connect to radio stream

  /api/audio/volume:
    post:
      tags:
        - Audio
      summary: Set audio master volume
      description: Sets the global audio playback volume (0 to 100%).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - volume
              properties:
                volume: { type: integer, minimum: 0, maximum: 100, example: 80 }
      responses:
        '200':
          description: Volume updated

  /api/audio/stop:
    post:
      tags:
        - Audio
      summary: Stop active audio playback
      description: Stops active WebRadio, DLNA or Bluetooth audio streaming.
      responses:
        '200':
          description: Audio stopped

  /api/audio/test:
    post:
      tags:
        - Audio
      summary: Play audio test tone
      description: Plays a short 880 Hz diagnostic test tone on the speaker.
      responses:
        '200':
          description: Test tone played

  /api/audio/gain:
    post:
      tags:
        - System
      summary: Set microphone hardware gain (ES7210)
      description: Sets the microphone analog/digital gain in dB (0 to 30 dB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gain
              properties:
                gain: { type: integer, minimum: 0, maximum: 30, example: 24 }
      responses:
        '200':
          description: Gain updated

  /api/audio/play:
    post:
      tags:
        - System
      summary: Play audio effect or tone
      description: Plays an alert tone or audio asset on the speaker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tone_hz: { type: integer, example: 440 }
                duration_ms: { type: integer, example: 200 }
      responses:
        '200':
          description: Audio playback started

  /api/gyro/status:
    get:
      tags:
        - System
      summary: Get gyroscope and orientation sensor status (QMI8658)
      description: Returns real-time 3-axis accelerometer and gyro data, auto-rotation angle, and tilt calibration status.
      responses:
        '200':
          description: Gyroscope readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean, example: true }
                  ax: { type: number, example: 0.96 }
                  ay: { type: number, example: 0.08 }
                  az: { type: number, example: -0.22 }
                  rotation_deg: { type: integer, example: 0 }

  /api/gyro/calibrate:
    post:
      tags:
        - System
      summary: Calibrate gyroscope zero offset
      responses:
        '200':
          description: Gyroscope calibrated successfully

  /api/update:
    post:
      tags:
        - System
      summary: OTA Firmware Binary Upload
      description: Upload a new firmware.bin to flash the device over-the-air.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                update:
                  type: string
                  format: binary
                  description: The firmware binary file (e.g. firmware-esp32s3_waveshare.bin)
      responses:
        '200':
          description: Firmware update accepted and flashed. Device reboots cleanly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Update successful, rebooting..."
        '400':
          description: Upload error, invalid firmware, or flash write failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "No firmware received or update failed"

  /api/ota:
    post:
      tags:
        - System
      summary: OTA Firmware Update (Alias of /api/update)
      description: Upload a new firmware.bin to flash the device over-the-air.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                update:
                  type: string
                  format: binary
                  description: The firmware binary file (e.g. firmware-esp32s3_waveshare.bin)
      responses:
        '200':
          description: Firmware update accepted and flashed. Device reboots cleanly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Update successful, rebooting..."
        '400':
          description: Upload error, invalid firmware, or flash write failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "No firmware received or update failed"

  /api/ota/check:
    get:
      tags:
        - System
      summary: Check for OTA updates
      description: Returns current firmware version, architecture, and whether online automated OTA is supported on this platform.
      responses:
        '200':
          description: Release update check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version: { type: string, example: "3.2.4" }
                  current_arch: { type: string, example: "esp32s3" }
                  latest_version: { type: string, example: "3.2.4" }
                  update_available: { type: boolean, example: false }
                  supported: { type: boolean, example: true }
                  in_progress: { type: boolean, example: false }
                  progress: { type: integer, example: 0 }
                  message: { type: string }

  /api/ota/auto-update:
    post:
      tags:
        - System
      summary: 1-Click Online OTA Download and Installation
      description: Downloads firmware binary from GitHub and flashes OTA partition automatically in background. Supported on both ESP32 and Raspberry Pi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - download_url
              properties:
                download_url:
                  type: string
                  example: "https://github.com/red77290/ArcadeMatrix/releases/download/v3.2.4/firmware-esp32s3_waveshare.bin"
      responses:
        '200':
          description: Firmware download and OTA worker initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "OTA download initiated"
        '400':
          description: Missing download_url or invalid URL scheme.
        '409':
          description: OTA update already in progress.

