; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_ldf_mode = deep+
test_build_src = true
extra_scripts = pre:scripts/build_webui.py
lib_deps = 
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
	bitbank2/AnimatedGIF @ ^2.1.1
	bitbank2/PNGdec @ ^1.0.3
	mathieucarbou/ESPAsyncWebServer @ ^3.1.5
	bblanchon/ArduinoJson @ ^6.21.5
	knolleary/PubSubClient @ ^2.8
	adafruit/Adafruit GFX Library @ ^1.11.9
	greiman/SdFat @ ^2.2.2

[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D ASYNC_JSON_SUPPORT=1
	-I.pio/libdeps/esp32dev/ArduinoJson/src
	-O2
lib_ignore = SD_MMC

[env:esp32s3_waveshare]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ASYNC_JSON_SUPPORT=1
	-D BOARD_HAS_PSRAM
	-D SPIRAM_DMA_BUFFER
	
	-D HARDWARE_PROFILE_WAVESHARE_S3
	-I.pio/libdeps/esp32s3_waveshare/ArduinoJson/src
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
	-O2
lib_ignore = SdFat
lib_ldf_mode = chain+
