; Common settings shared by both hardware targets. Each board-specific env below
; extends this one and only overrides what actually differs (board, PSRAM, partitions).
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_ldf_mode = deep+
test_build_src = true
lib_deps = 
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
	bitbank2/AnimatedGIF @ ^2.1.1
	mathieucarbou/ESPAsyncWebServer @ ^3.1.5
	bblanchon/ArduinoJson @ ^6.21.5
	knolleary/PubSubClient @ ^2.8
	adafruit/Adafruit GFX Library @ ^1.11.9

; --- ESP32 classic (WROOM, no PSRAM) ---
; Hard limit: 128x32 panels max (see docs/HARDWARE.md). Do NOT request 256x64 on this target,
; the HUB75 DMA double-buffer (~98KB/frame) will not fit in the 320KB internal SRAM.
[env:esp32dev]
board = esp32dev
; This firmware never uses SPIFFS/LittleFS (all assets live on the external SD card), so the
; default partition table's ~900KB SPIFFS partition is pure waste while the OTA app partition
; was starved at 1.25MB/98%+ full. min_spiffs.csv keeps the same dual-bank OTA layout but grows
; each app slot to ~1.875MB (app0/app1), buying ~650KB of extra flash headroom for future
; features (PNG decoding, weather icons, etc.) at zero functional cost.
board_build.partitions = min_spiffs.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D ASYNC_JSON_SUPPORT=1
	-I.pio/libdeps/esp32dev/ArduinoJson/src
	-O2

; --- ESP32-S3 (N8R8/N16R8, octal PSRAM) ---
; Required for 256x64+ panels: the DMA double-buffer offloads to PSRAM instead of internal SRAM.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_8MB.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D ASYNC_JSON_SUPPORT=1
	-D BOARD_HAS_PSRAM
	-I.pio/libdeps/esp32s3/ArduinoJson/src
	-O2


