<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="bgDmd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#091926"/>
    </linearGradient>
    <linearGradient id="streamBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="636" height="196" rx="14" fill="url(#bgDmd)" stroke="#00e676" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Header -->
  <text x="24" y="34" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glowCyan)">⚡ DMDZ LOSSLESS HEATSHRINK STREAM + ZERO-TEAR DMA</text>
  <rect x="518" y="18" width="98" height="22" rx="5" fill="rgba(0, 230, 118, 0.18)" stroke="#00e676"/>
  <text x="567" y="33" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">60 FPS LOCK</text>

  <!-- Before vs After Cards -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="280" height="124" rx="10" fill="rgba(255, 0, 85, 0.06)" stroke="rgba(255, 0, 85, 0.35)"/>
    <text x="16" y="24" fill="#ff0055" font-family="monospace" font-size="11" font-weight="bold">BEFORE: GIF SPIFS/SD BOTTLENECK</text>
    <text x="16" y="48" fill="#d0d8e8" font-family="monospace" font-size="11">• LZW Dict Allocations on Core 1</text>
    <text x="16" y="68" fill="#d0d8e8" font-family="monospace" font-size="11">• SD Bus Contention on 256x64</text>
    <rect x="16" y="86" width="248" height="22" rx="4" fill="#180a14"/>
    <rect x="18" y="88" width="110" height="18" rx="3" fill="#ff0055" opacity="0.7"/>
    <text x="140" y="101" fill="#ff88aa" font-family="monospace" font-size="10" text-anchor="middle">24–32 FPS • JITTER</text>
  </g>

  <g transform="translate(336, 52)">
    <rect x="0" y="0" width="280" height="124" rx="10" fill="rgba(0, 230, 118, 0.07)" stroke="rgba(0, 230, 118, 0.45)"/>
    <text x="16" y="24" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">AFTER: DMDZ RGB565 STREAMING</text>
    <text x="16" y="48" fill="#e8fff3" font-family="monospace" font-size="11">• Pre-indexed Heatshrink LZSS</text>
    <text x="16" y="68" fill="#e8fff3" font-family="monospace" font-size="11">• Triple-Buffer SRSW Core 1</text>
    <rect x="16" y="86" width="248" height="22" rx="4" fill="#071a12"/>
    <rect x="18" y="88" width="244" height="18" rx="3" fill="url(#streamBar)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="140" y="101" fill="#04100b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">60 FPS • ZERO ALLOC • SUB-MS</text>
  </g>
</svg>
