; ==========================================
; ArcadeMatrix Configuration File (conf.ini)
; ==========================================
; Place this file in the root of your SD card.
; Do not use spaces around the '=' sign.

[WIFI]
; Your Wi-Fi network credentials
SSID=MyNetwork
PASSWORD=SecretPassword
; The mDNS hostname to access the Web UI (e.g. http://arcadematrix.local)
HOSTNAME=arcadematrix

[MATRIX]
; Total width of a single panel in pixels
; Possible values: 64, 128
WIDTH=64
; Total height of a single panel in pixels
; Possible values: 32, 64
HEIGHT=32
; HUB75 Panel routing type (P2, P2.5, P3, P4, P5).
PANEL_TYPE=P3
; Number of daisy-chained panels (default is 2)
CHAIN=2
; Global brightness / power limit (0 to 100)
BRIGHTNESS_LIMIT=50
; PWM bits / Color depth (e.g., 8). Lower values increase refresh rate but reduce color precision.
PWM_BITS=8
; Force single buffering (true) instead of double buffering (false).
; True saves 50% RAM but may cause flickering on very large panels.
FORCE_SINGLE_BUFFER=false
; Custom RGB sequence if your panel has swapped colors (e.g. RBG, BGR)
RGB_SEQUENCE=RGB
; Maximum limit for refresh rate in Hz (e.g., 60, 90, 120)
LIMIT_REFRESH_RATE_HZ=90

[MQTT]
; Set to true or 1 to enable Batocera/Recalbox integration
ENABLED=false
; IP Address of your MQTT Broker (usually your Batocera/Raspberry Pi IP)
BROKER=192.168.1.100
; MQTT Port (Default is 1883)
PORT=1883
; Optional: Username and Password for the broker. Leave blank if none.
USER=
PASS=
; The name this device will use to register on the broker
DEVICE_NAME=ArcadeMatrix
; Topics to listen to for scraping system states
TOPIC_BATOCERA=batocera/system/playing
TOPIC_RECALBOX=recalbox/system/playing

[TIME]
; NTP Time Server for automatic clock sync via Internet
NTP_SERVER=pool.ntp.org
; Your POSIX timezone string. Find yours here: https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv
; Example for Europe/Paris: CET-1CEST,M3.5.0,M10.5.0/3
TIMEZONE=CET-1CEST,M3.5.0,M10.5.0/3
; Use 24-hour format (true) or 12-hour AM/PM format (false)
FORMAT_24H=true
; Default arcade clock font (0 to 5)
CLOCK_FONT=0
; Clock font size multiplier (1, 2, or 3)
CLOCK_SIZE=2
; Clock theme ID (see docs/CONFIGURATION.md for full list).
; Highlights: 18=Cyberpunk, 19=Flip clock, 23=Tetris, 26=Pac-Man, 29=Gameboy Tetris.
CLOCK_THEME=0
; Manual XY offsets to center the clock perfectly (can be negative)
CLOCK_OFFSET_X=0
CLOCK_OFFSET_Y=0
; Hex gradient colors for themes that support a custom color.
CLOCK_COLOR_1=#ffffff
CLOCK_COLOR_2=#ffffff
; Optional custom font path
CLOCK_FONT_PATH=

[IDLE]
; Order of the auto-rotation sequence. Separate with commas.
; Available modules: clock, date, weather, gifs, temp, decibel, crypto, stock
ROTATION=clock,date,weather,gifs,temp,decibel
; How many seconds to display each module before rotating
CLOCK_DURATION_SEC=15
DATE_DURATION_SEC=10
WEATHER_DURATION_SEC=10
TEMP_DURATION_SEC=8
DECIBEL_DURATION_SEC=10
; How many GIFs to play before rotating to the next module
GIFS_COUNT=5
; Enable MUGEN fighter sprites overlay
FIGHTER_ENABLED=true
; Seconds to wait between individual MUGEN fights
FIGHTER_INTERVAL_SEC=10

[ENVIRONMENT]
; Temperature unit ("C" or "F")
UNIT=C
TEMP_OFFSET=0.0

[AUDIO]
; Priority music visualizer toggle (true/false)
VISUALIZER_ENABLED=false
; Visualizer mode: spectrum, waveform, radial, neon_fire
VISUALIZER_MODE=spectrum
MIC_GAIN=1.0
DB_CALIBRATION=0.0

[DATE]
; PublisherTheme ID (0=Default, 1=Neon, 2=Retro, 3=Monochrome)
THEME=0
; Background image for the date module (e.g. stage1.raw)
BACKGROUND_SPRITE=stage1.raw
; Date string format (e.g. "DD/MM")
FORMAT=DD/MM
; Font ID for the Date (0 to 5)
DATE_FONT=0
; Date font size multiplier
DATE_SIZE=2
; Manual XY offsets
DATE_OFFSET_X=0
DATE_OFFSET_Y=0
; Hex gradient colors
DATE_COLOR_1=#ffffff
DATE_COLOR_2=#ffffff
; Custom font path
DATE_FONT_PATH=

[WEATHER]
; OpenWeatherMap API Key (Get a free one at openweathermap.org)
API_KEY=
; City name for weather (e.g. Paris,FR or New York,US)
CITY=Paris,FR
; Language (e.g. en, fr)
LANG=fr
; Manual XY offsets
WEATHER_OFFSET_X=0
WEATHER_OFFSET_Y=0

[STANDBY]
; Automatically turn off the matrix at night to save power (true/false)
NIGHT_MODE_ENABLED=false
; Time to power down (HH:MM)
TURN_OFF_AT=23:00
; Time to wake up (HH:MM)
WAKE_UP_AT=07:00
; Brightness level (0 to 100) during standby
NIGHT_BRIGHTNESS=10

[FONTS]
; Optional SD-loadable custom bitmap font
CUSTOM_FONT_PATH=

[CRYPTO]
; Enable real-time cryptocurrency ticker (true/false)
ENABLED=true
; Comma-separated list of crypto symbols (e.g. BTC,ETH,SOL,DOGE)
SYMBOLS=BTC,ETH,SOL,DOGE
; Display duration per symbol in seconds
DURATION_SEC=5
; Cache time-to-live in minutes
CACHE_TTL_MIN=1
; Currency symbol ("USD", "EUR")
CURRENCY=USD

[STOCK]
; Enable real-time stock market ticker (true/false)
ENABLED=true
; Comma-separated list of stock symbols (e.g. AAPL,NVDA,TSLA,MSFT)
SYMBOLS=AAPL,NVDA,TSLA,MSFT
; Display duration per symbol in seconds
DURATION_SEC=5
; Cache time-to-live in minutes
CACHE_TTL_MIN=1
