name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, esp32s3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      # Unity tests require real hardware (Arduino/WiFi/SD APIs) - see docs/GETTING_STARTED.md.
      # This only compiles the test target to catch build regressions; it does not execute it.
      - name: Compile native-independent unit tests (${{ matrix.env }})
        run: pio test -e ${{ matrix.env }} --without-uploading --without-testing

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  deploy-pages:
    # Only publish the web flasher from main, and only once the repo is public - GitHub Pages
    # for private repositories requires a paid plan (verified: POST /pages returns 422 "Your
    # current plan does not support GitHub Pages for this repository" on a free-plan private
    # repo). This condition self-activates the day the repo is switched to public - no further
    # workflow changes needed, just flip repo visibility in Settings.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download esp32dev artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: artifacts/esp32dev

      - name: Download esp32s3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: artifacts/esp32s3

      - name: Assemble site
        run: |
          mkdir -p _site
          cp webinstaller/index.html webinstaller/manifest-esp32dev.json webinstaller/manifest-esp32s3.json _site/
          cp -r webinstaller/bin _site/bin
          cp artifacts/esp32dev/bootloader.bin _site/bootloader-esp32dev.bin
          cp artifacts/esp32dev/partitions.bin _site/partitions-esp32dev.bin
          cp artifacts/esp32dev/firmware.bin   _site/firmware-esp32dev.bin
          cp artifacts/esp32s3/bootloader.bin  _site/bootloader-esp32s3.bin
          cp artifacts/esp32s3/partitions.bin  _site/partitions-esp32s3.bin
          cp artifacts/esp32s3/firmware.bin    _site/firmware-esp32s3.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
