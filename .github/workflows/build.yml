name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, esp32s3_waveshare]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate documentation & SD configuration
        run: python3 scripts/validate_docs.py

      - name: Validate WebInstaller manifest
        run: python3 scripts/validate_webinstaller.py

      - name: Validate UI & I18n contracts
        run: python3 scripts/validate_ui_and_i18n.py

      - name: Execute host native unit test suite
        run: python3 scripts/run_native_tests.py

      - name: Build & validate unit test suites (${{ matrix.env }})
        run: pio test -e ${{ matrix.env }} --without-uploading --without-testing


      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Verify application firmware integrity (${{ matrix.env }})
        run: |
          python3 -c "
          import os, sys
          fw = '.pio/build/${{ matrix.env }}/firmware.bin'
          size = os.path.getsize(fw)
          print(f'Built firmware size: {size} bytes')
          if size < 1000000:
              print(f'ERROR: {fw} is too small ({size} bytes), expected full app binary (>1MB)!')
              sys.exit(1)
          with open(fw, 'rb') as f:
              content = f.read()
          if b'test_hardware' in content:
              print('ERROR: {fw} contains unit test symbols! pio test output contaminated firmware.bin!')
              sys.exit(1)
          print('✅ Application firmware verified successfully.')
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  deploy-pages:
    # Only publish the web flasher on releases (when a tag is pushed), and only once the repo is public - GitHub Pages
    # for private repositories requires a paid plan.
    if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download esp32dev artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: artifacts/esp32dev

      - name: Download esp32s3_waveshare artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3_waveshare
          path: artifacts/esp32s3_waveshare

      - name: Assemble site
        run: |
          mkdir -p _site
          cp webinstaller/index.html webinstaller/manifest-esp32dev.json webinstaller/manifest-esp32s3_waveshare.json _site/
          cp -r webinstaller/bin _site/bin
          cp artifacts/esp32dev/bootloader.bin _site/bootloader-esp32dev.bin
          cp artifacts/esp32dev/partitions.bin _site/partitions-esp32dev.bin
          cp artifacts/esp32dev/firmware.bin   _site/firmware-esp32dev.bin
          cp artifacts/esp32s3_waveshare/bootloader.bin  _site/bootloader-esp32s3_waveshare.bin
          cp artifacts/esp32s3_waveshare/partitions.bin  _site/partitions-esp32s3_waveshare.bin
          cp artifacts/esp32s3_waveshare/firmware.bin    _site/firmware-esp32s3_waveshare.bin
          python3 -c "
          import os, sys
          for env in ['esp32dev', 'esp32s3_waveshare']:
              path = f'_site/firmware-{env}.bin'
              size = os.path.getsize(path)
              print(f'Installer {path}: {size} bytes')
              if size < 1000000:
                  print(f'ERROR: {path} is too small ({size} bytes)!')
                  sys.exit(1)
              with open(path, 'rb') as f:
                  if b'test_hardware' in f.read():
                      print(f'ERROR: {path} contains unit test symbols!')
                      sys.exit(1)
          print('✅ Web installer binaries verified successfully.')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
