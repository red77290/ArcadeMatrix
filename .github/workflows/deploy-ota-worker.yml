name: Deploy OTA Stats Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'tools/ota-stats-worker/**'
      - '.github/workflows/deploy-ota-worker.yml'
  workflow_dispatch: {}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run OTA Stats Worker unit test suite
        run: node tools/ota-stats-worker/test_worker.mjs

      - name: Check Cloudflare credentials
        id: cf_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ℹ️ Cloudflare Worker Deployment Skipped (Secrets Not Set)"
              echo ""
              echo "Unit tests passed! To enable automatic 1-click deployment of \`arcadematrix-ota-stats\` + D1 database \`arcadematrix-ota-db\`, add the following repository secret(s) under **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "1. \`CLOUDFLARE_API_TOKEN\` — Cloudflare API Token with **Account → D1 → Edit** and **Account → Workers Scripts → Edit** permissions."
              echo "2. \`CLOUDFLARE_ACCOUNT_ID\` *(optional, only required if your token belongs to multiple Cloudflare accounts)*."
              echo ""
              echo "Then re-run this workflow via **Actions → Deploy OTA Stats Cloudflare Worker → Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Auto-provision D1 schema & deploy Cloudflare Worker
        if: steps.cf_creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ota-stats-worker/deploy_worker.mjs
